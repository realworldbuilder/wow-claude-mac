name: test

on:
  push:
  pull_request:

jobs:
  test:
    # The codec round-trip runs the real decoder: capture.ps1 on Windows, the
    # compiled capture-mac.swift on macOS.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
